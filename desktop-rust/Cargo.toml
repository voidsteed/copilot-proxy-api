[package]
name = "copilot-proxy-desktop"
version = "0.0.8"
edition = "2024"
description = "Minimal native Rust desktop companion for Copilot Proxy"

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "svg", "tokio", "advanced", "crisp"] }
tray-icon = "0.27.0"
muda = "0.22.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "io-util", "process", "sync", "time", "macros"] }
arboard = "3.7.0"
dirs = "7.0.0"
resvg = "0.50.0"
tiny-skia = "0.12.0"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSRunningApplication", "NSWindow", "NSAppearance"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSUserDefaults"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

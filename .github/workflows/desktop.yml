name: Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/desktop.yml
      - desktop/**
      - src/**
      - tests/**
      - package.json
      - bun.lock
      - tsconfig.json
      - eslint.config.js
  push:
    branches: [main, master]
    paths:
      - .github/workflows/desktop.yml
      - desktop/**
      - src/**
      - tests/**
      - package.json
      - bun.lock
      - tsconfig.json
      - eslint.config.js

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native smoke on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/copilot-bridge/cache/bun
      ELECTRON_CACHE: ${{ runner.temp }}/copilot-bridge/cache/electron
      ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/copilot-bridge/cache/electron-builder
      XDG_CACHE_HOME: ${{ runner.temp }}/copilot-bridge/cache/xdg
      npm_config_cache: ${{ runner.temp }}/copilot-bridge/cache/npm
      TMPDIR: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}
      COPILOT_BRIDGE_PACKAGE_OUTPUT: ${{ runner.temp }}/copilot-bridge/package
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Put build output in runner temporary storage
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs"
          import path from "node:path"
          const output = path.join(process.env.RUNNER_TEMP, "copilot-bridge", "dist")
          fs.mkdirSync(output, { recursive: true })
          fs.symlinkSync(output, "desktop/dist", process.platform === "win32" ? "junction" : "dir")
          NODE

      - name: Install root dependencies without Git hooks
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Electron binary
        run: node desktop/node_modules/electron/install.js

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus-x11 libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libdrm2 libgbm1 libgtk-3-0t64 libnss3 \
            libx11-xcb1 libxcomposite1 libxdamage1 libxkbcommon0 libxrandr2 \
            libxss1 xauth xvfb

      - name: Lint desktop files
        run: bun run lint --no-cache desktop

      - name: Typecheck proxy
        run: bun run typecheck

      - name: Test proxy
        run: bun test ./tests

      - name: Typecheck desktop
        run: bun run desktop:typecheck

      - name: Test desktop
        run: bun run desktop:test

      - name: Build native code and renderer
        run: bun run desktop:build

      - name: Smoke test native app
        if: runner.os != 'Linux'
        env:
          COPILOT_BRIDGE_SMOKE_OUTPUT: ${{ runner.temp }}/copilot-bridge/evidence/native
        run: bun run desktop:smoke

      - name: Smoke test native app on Linux
        if: runner.os == 'Linux'
        env:
          COPILOT_BRIDGE_SMOKE_OUTPUT: ${{ runner.temp }}/copilot-bridge/evidence/native
        run: dbus-run-session -- xvfb-run -a bun run desktop:smoke

      - name: Package host architecture and smoke test installed executable
        if: runner.os != 'Linux'
        env:
          COPILOT_BRIDGE_SMOKE_OUTPUT: ${{ runner.temp }}/copilot-bridge/evidence/packaged
        run: node desktop/scripts/package-smoke.ts

      - name: Package host architecture and smoke test installed executable on Linux
        if: runner.os == 'Linux'
        env:
          COPILOT_BRIDGE_SMOKE_OUTPUT: ${{ runner.temp }}/copilot-bridge/evidence/packaged
        run: dbus-run-session -- xvfb-run -a node desktop/scripts/package-smoke.ts

      - name: Archive unsigned self-contained app
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process"
          import path from "node:path"
          const archive = path.join(process.env.RUNNER_TEMP, "copilot-bridge", "Copilot-Bridge-unsigned.tar.gz")
          execFileSync("tar", ["-czf", archive, "-C", process.env.COPILOT_BRIDGE_PACKAGE_OUTPUT, "."], { stdio: "inherit" })
          NODE

      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copilot-bridge-${{ runner.os }}-${{ runner.arch }}-evidence
          path: ${{ runner.temp }}/copilot-bridge/evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: copilot-bridge-${{ runner.os }}-${{ runner.arch }}-unsigned
          path: ${{ runner.temp }}/copilot-bridge/Copilot-Bridge-unsigned.tar.gz
          if-no-files-found: error
          retention-days: 14

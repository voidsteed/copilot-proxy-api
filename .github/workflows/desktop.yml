name: Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/desktop.yml
      - desktop-rust/bridge/**
      - src/**
      - tests/**
      - package.json
      - bun.lock
      - tsconfig.json
      - eslint.config.js
  push:
    branches: [main, master]
    paths:
      - .github/workflows/desktop.yml
      - desktop-rust/bridge/**
      - src/**
      - tests/**
      - package.json
      - bun.lock
      - tsconfig.json
      - eslint.config.js

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: Desktop bridge on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install root dependencies without Git hooks
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install desktop bridge dependencies
        working-directory: desktop-rust/bridge
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint desktop bridge files
        run: bun run lint --no-cache desktop-rust/bridge

      - name: Typecheck proxy
        run: bun run typecheck

      - name: Test proxy
        run: bun test ./tests

      - name: Typecheck desktop bridge
        run: bun run desktop:typecheck

      - name: Test desktop bridge
        run: bun run desktop:test

      - name: Build desktop bridge and engine
        run: bun run desktop:build

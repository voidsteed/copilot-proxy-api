name: Desktop Rust Release

on:
  pull_request:
    paths:
      - .github/workflows/release-desktop.yml
      - desktop-rust/**
      - desktop/bridge/**
      - desktop/main/clipboard.ts
      - desktop/main/vault.ts
      - desktop/shared/**
      - desktop/scripts/build.mjs
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Desktop release tag (for example desktop-v0.0.10; leave empty for dry-run artifact upload only)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package-macos:
    name: Rust desktop macOS (arm64)
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      cli_version: ${{ steps.versions.outputs.cli_version }}
      desktop_tag: ${{ steps.versions.outputs.desktop_tag }}
      desktop_version: ${{ steps.versions.outputs.desktop_version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-rust

      - name: Resolve package and release versions
        id: versions
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          CLI_VERSION="$(node -p "require('./package.json').version")"
          DEFAULT_DESKTOP="$(node -p "require('./desktop/package.json').version")"
          TAG_NAME=""
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_TAG}" ]; then
            if [[ "${INPUT_TAG}" == desktop-v* ]]; then
              TAG_NAME="${INPUT_TAG}"
            else
              TAG_NAME="desktop-v${INPUT_TAG#v}"
            fi
          elif [[ "${GITHUB_REF_NAME}" == desktop-v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          DESKTOP_VERSION="${DEFAULT_DESKTOP}"
          if [ -n "${TAG_NAME}" ]; then
            DESKTOP_VERSION="${TAG_NAME#desktop-v}"
          fi
          echo "cli_version=${CLI_VERSION}" >> "$GITHUB_OUTPUT"
          echo "desktop_tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "desktop_version=${DESKTOP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install root and desktop dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun install --cwd desktop --frozen-lockfile --ignore-scripts

      - name: Run Rust unit tests
        working-directory: desktop-rust
        run: cargo test --bin copilot-proxy-desktop

      - name: Package macOS Apple Silicon release artifacts
        env:
          COPILOT_PROXY_PACKAGE_OUTPUT: ${{ runner.temp }}/copilot-proxy-rust-package
          CARGO_TARGET_DIR: ${{ github.workspace }}/desktop-rust/target
          COPILOT_PROXY_DESKTOP_VERSION: ${{ steps.versions.outputs.desktop_version }}
        run: ./desktop-rust/scripts/package-mac.sh

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: copilot-proxy-rust-macos-arm64
          path: ${{ runner.temp }}/copilot-proxy-rust-package/release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish macOS desktop release
    needs: test-and-package-macos
    if: startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: copilot-proxy-rust-macos-arm64
          path: release-artifacts

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.test-and-package-macos.outputs.desktop_tag }}
          DESKTOP_VERSION: ${{ needs.test-and-package-macos.outputs.desktop_version }}
          CLI_VERSION: ${{ needs.test-and-package-macos.outputs.cli_version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          GENERATED="$(gh api "repos/${GH_REPO}/releases/generate-notes" \
            -f tag_name="${TAG_NAME}" \
            -f target_commitish="${TARGET_SHA}" \
            --jq '.body' 2>/dev/null || true)"
          cat > release-notes.md <<EOF
          ## Latest Packages

          ### Desktop App (macOS Apple Silicon)
          - **Release:** \`${TAG_NAME}\`
          - **Downloads:** \`Copilot-Proxy-${DESKTOP_VERSION}-macos-arm64.dmg\`, \`Copilot-Proxy-${DESKTOP_VERSION}-macos-arm64.zip\`, and \`SHA256SUMS.txt\` (attached below)
          - **First launch (ad-hoc signed):**
            \`\`\`sh
            xattr -dr com.apple.quarantine "/Applications/Copilot Proxy.app"
            \`\`\`

          ### CLI (npm)
          - **Package:** [\`copilot-proxy-api@${CLI_VERSION}\`](https://www.npmjs.com/package/copilot-proxy-api) ([release \`v${CLI_VERSION}\`](https://github.com/${GH_REPO}/releases/tag/v${CLI_VERSION}))
          - **Quick start:**
            \`\`\`sh
            npx copilot-proxy-api@latest start
            \`\`\`

          ${GENERATED}
          EOF
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" \
              --title "Copilot Proxy Desktop ${DESKTOP_VERSION} + CLI v${CLI_VERSION}" \
              --notes-file release-notes.md
            gh release upload "${TAG_NAME}" release-artifacts/* --clobber
          else
            gh release create "${TAG_NAME}" release-artifacts/* \
              --target "${TARGET_SHA}" \
              --title "Copilot Proxy Desktop ${DESKTOP_VERSION} + CLI v${CLI_VERSION}" \
              --notes-file release-notes.md
          fi
